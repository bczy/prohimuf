name: Explore portrait-robot faces (reconnaissance)

# RECONNAISSANCE, not production (Bertrand, 2026-08-06) — separate on purpose
# from gen-portrait-plate.yml, per "sépare-les proprement, ne relâche pas les
# garde-fous du chemin de production": this workflow never touches
# public/assets/, never touches the manifest, never commits, and never
# fails on a registration/measurement problem. It exists for one question —
# "à quoi ressemble ce que le prompt produit, et deux graines donnent-elles
# deux têtes distinctes aux mêmes proportions" — generates N whole-face
# plates (scripts/slice-portrait-plate.mjs --explore-faces N) from the SAME
# prompt family with different seeds, and uploads the raw PNGs + a
# best-effort measurement report as a CI artifact to look at.
#
# The strict production path (gen-portrait-plate.yml, `runReal`) is
# untouched by this file.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of whole-face plates to generate"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: gen-portrait-explore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    env:
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pngjs (registration measurement)
        run: |
          # Pinned to the package.json version; --no-save so the lockfile-less
          # runner install never rewrites package.json. Same shape as
          # gen-portrait-plate.yml's own install step.
          npm install --no-save --legacy-peer-deps --ignore-scripts pngjs@7.0.0

      - name: Install @napi-rs/canvas (JPEG fallback decode, see ensurePngBuffer)
        run: |
          # Same reason as gen-portrait-plate.yml: Pollinations is known to
          # serve a JPEG instead of the requested PNG depending on request
          # parameters (RE-PANEL run 3995325a).
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2

      - name: Generate N whole-face plates + best-effort report (FLUX)
        run: node scripts/slice-portrait-plate.mjs --explore-faces "${{ github.event.inputs.count }}"

      - name: Upload the plates + report for a human to look at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-explore-faces
          path: scripts/.dbg-portrait-explore/
          if-no-files-found: warn
          retention-days: 14
