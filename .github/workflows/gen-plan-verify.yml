name: Generated level — playability proof

# SP2 phase (e), "the proof" — spec-level-harness-sp2 §3, plan T6. Builds the
# production bundle, serves it, and drives scripts/e2e-generated-level.mjs
# against the SP1 verification seam (`?preview=level&level=<level_id>`) — the
# generalized, committed form of the SP1 §8 session driver
# (docs/qa/evidence/story-level-harness-sp1/ was hand-run, not CI-produced).
#
# Meant to run LAST, after phases (a)-(d) have landed their assets on the
# branch (backdrop, calibrated windows, skins, props) — it only PROVES
# playability, it never generates anything itself.
on:
  workflow_dispatch:
    inputs:
      level_id:
        description: "Generated level id (src/game/levels/generated/<id>.ts)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gen-plan-verify-${{ github.event.inputs.level_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Never on main — same guard as every other gen-*.yml in this family.
    if: github.ref_name != 'main'
    env:
      LEVEL_ID: ${{ github.event.inputs.level_id }}
    steps:
      # FIRST, before the id touches any path or dynamic import: level_id is
      # the one attacker-influenced input of this job (contents: write), and
      # e2e-generated-level.mjs feeds it to loadPlan.mjs's jiti import, which
      # EXECUTES the resolved module (panel run-2 on PR #156). Same step as
      # gen-plan-backdrop.yml / gen-plan-sprites.yml.
      - name: Validate level_id (allowlist)
        run: |
          set -euo pipefail
          if [[ ! "$LEVEL_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::invalid level_id '${LEVEL_ID}' — a generated plan id must match ^[a-z0-9-]+$ (see src/game/levels/generated/); refusing to use it in paths or dynamic imports."
            exit 1
          fi
          echo "level_id '${LEVEL_ID}' is well-formed"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the build and run the playability proof
        run: |
          node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/preview.log 2>&1 &
          SERVER_PID=$!
          echo "preview server pid=$SERVER_PID"
          UP=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/prohimuf/ >/dev/null; then UP=1; break; fi
            sleep 1
          done
          if [ "$UP" != "1" ]; then
            echo "::error::Preview server failed to start"
            cat /tmp/preview.log || true
            exit 1
          fi
          echo "preview server is up"
          status=0
          PREVIEW_URL="http://127.0.0.1:4173/prohimuf/" node scripts/e2e-generated-level.mjs "$LEVEL_ID" || status=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$status"

      - name: Commit the playability evidence
        # Runs even when the proof step above FAILED — the evidence (including
        # the 00-failure.png shot and the report with its captured pageErrors)
        # is exactly what a human needs to diagnose the failure, so it is
        # committed either way; only the job's own exit status reflects PASS/FAIL.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "docs/qa/evidence/${LEVEL_ID}" ]; then
            git add -f "docs/qa/evidence/${LEVEL_ID}"
          fi
          if git diff --cached --quiet; then
            echo "No evidence to commit."
          else
            git commit -m "docs(qa): playability evidence for ${LEVEL_ID} (plan T6)"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Re-assert the proof's own verdict
        # The commit step above always runs (even on failure) so the evidence
        # is never lost, but a failed proof must still fail the WORKFLOW — this
        # step re-reads the report and fails if the run wasn't clean.
        if: always()
        run: |
          report="docs/qa/evidence/${LEVEL_ID}/report.json"
          if [ ! -f "$report" ]; then
            echo "::error::no report.json produced for ${LEVEL_ID}"
            exit 1
          fi
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const ok = r.timerTicking === true && Array.isArray(r.pageErrors) && r.pageErrors.length === 0;
            if (!ok) {
              console.error('playability proof FAILED:', JSON.stringify(r, null, 2));
              process.exit(1);
            }
            console.log('playability proof PASSED:', JSON.stringify(r));
          " "$report"
