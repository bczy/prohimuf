name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # DOC FRESHNESS — the agents-pipeline infographic must be kept in sync with
      # the agent protocol/roster/sprites (see the script header for the loop).
      # Needs only node + python3, so it runs before install to fail fast.
      - name: Agents infographic freshness
        run: node scripts/check-agents-infographic.mjs

      # DOC FRESHNESS — the harness infographics must be kept in sync with the
      # harness docs/ADRs they visualise (see the script header for the loop).
      - name: Harness infographics freshness
        run: node scripts/check-harness-infographics.mjs

      # ADR REGISTRY FRESHNESS — the README index and the deployed ADR page
      # (public/adr/index.html) are generated from docs/adr/NNNN-*.md. A PR that
      # adds/edits/renames an ADR (even a Proposed draft) must regenerate them in
      # the same PR; also hard-fails on a duplicate ADR number. Pure node, runs
      # before install to fail fast. Fix: node scripts/gen-adr-index.mjs --write
      - name: ADR registry freshness
        run: node scripts/gen-adr-index.mjs --check

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # ART GATE 1 — static prompt-contract lint over levelArt.json (no network,
      # <1s). Catches house-style/neon-field/negation/word-budget violations in
      # the art prompts before any paid FLUX generation runs. Pure node, so it
      # needs no browser or build.
      - name: Art prompt contract lint
        run: node scripts/check-art-prompts.mjs

      # ART GATE — hero wiring guard (ADR-0043). Loads references/approved/
      # heroes.json (empty ⇒ PASS) and, for every declared hero, asserts the
      # wired generator's own planRequests() really threads it into image=
      # (same buildRequestUrl the runtime generator uses) plus heroes.json ↔
      # HEROES.md ↔ frozen-file coherence. Pure node, no network.
      - name: Hero wiring guard
        run: node scripts/check-hero-wiring.mjs

      - name: Format check
        run: yarn format:check

      - name: Test with coverage
        run: yarn test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E · home · in-game · assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # Default base (/prohimuf/) — matches the base passed to the E2E actions.
      - name: Build
        run: yarn build

      - name: E2E home-screen smoke
        uses: ./.github/actions/e2e-home
        with:
          base: /prohimuf/

      - name: E2E in-game smoke
        uses: ./.github/actions/e2e-ingame
        with:
          base: /prohimuf/

      # Hard gate on the built assets (missing/undersized). Script provided by
      # the QA lane in parallel — wired here.
      - name: E2E assets gate
        run: node scripts/e2e-assets.mjs

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
