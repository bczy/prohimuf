name: Generate enemy-type sprites

# Generation of the enemy archetype sprites AND their flipbook frames. Enemies
# carry a minimal 2-frame flip (6 fps) as separate PNGs named `_f<N>` after the
# variant suffix (enemy_shooting_2_f2.png), defined in the `enemies` block of
# levelArt.json (ADR 0016). These frame files match the enemy_*.png glob below,
# so cutout/commit need NO structural change. Generates only MISSING files (in
# practice just the _f<N> frames — committed frame-1 art is regenerated ONLY by
# the generator's matched-pair fallback when kontext img2img fails, a loudly
# logged exception reviewed at the art gate; FORCE=1 never touches frame 1),
# chroma-keys them, and commits them to the current branch. Deliberate runs only:
# manual (workflow_dispatch) or by touching the dispatch marker
# .github/dispatch/gen-sprites (see docs/adr/0009). The sprites are already
# committed, so this is just a regeneration tool — running it on every push
# re-keyed existing sprites and created noise. After cutout, fill-sprite-holes.mjs
# SOLIDIFIES the figures (fills the porous body left where dark clothing matched the
# key) and a --check gate FAILS the job if any survive — no enemy may ship porous.
on:
  workflow_dispatch:
  push:
    # Only branch pushes (never main); a branches filter also drops tag pushes.
    branches-ignore: ["main"]
    paths:
      - ".github/dispatch/gen-sprites"

permissions:
  contents: write

concurrency:
  group: gen-sprites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # merge/rebase/revert pushes can match the paths filter; only explicit ci(dispatch): commits may fire it.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ci(dispatch):')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate missing enemy-type sprites
        run: node scripts/gen-enemy-types.mjs

      - name: Chroma-key sprite backgrounds to transparency
        run: |
          # Pinned exact version; --ignore-scripts skips postinstall since the
          # prebuilt native binary is fetched by the package resolution itself.
          # If --ignore-scripts ever breaks the prebuilt fetch, drop the flag but
          # keep the pin.
          # cutout-enemies.mjs runs two corner-adaptive passes: the edge
          # flood-fill AND an enclosed-island pass that clears ground fully
          # walled in by the subject (bike-frame triangle, wheel interiors) —
          # keyed to the sampled corner colour, so it works whether FLUX returns
          # the prompted black ground or a white one. This no-args batch keys
          # ONLY freshly generated sprites (opaque corners); already-committed
          # pre-keyed sprites are skipped, so a regen never re-keys accepted art
          # (see docs/adr/0013).
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2
          node scripts/cutout-enemies.mjs

      - name: Solidify enemy sprite figures
        run: |
          # The chroma-key cutout leaves the figure POROUS where dark clothing
          # matched the near-black key ground — see-through gaps in legs/torso,
          # reachable through both enclosed AND border-connected transparency.
          # fill-sprite-holes.mjs runs two passes: PASS A reconstructs the solid
          # body (bottom-row seal + disk-10 closing + fill-holes + largest CC +
          # disk-1 erode) and fills it with the dark-clothing tone; PASS B mops up
          # any leftover enclosed enclave (boundary-mean colour). It only ever turns
          # transparent px opaque — a self-check aborts if an opaque px would change.
          # @napi-rs/canvas is already installed by the cutout step above (the
          # decoder is shared) — no duplicate install needed.
          node scripts/fill-sprite-holes.mjs

      - name: Gate — no enemy figure may ship porous
        run: |
          # Bertrand's validation condition ("everything solid"): no enemy character
          # may ship see-through. --check writes nothing and exits 1 if EITHER pass
          # would still fill anything on ANY enemy_*.png after the solidify step,
          # failing the job before commit.
          node scripts/fill-sprite-holes.mjs --check

      - name: Gate — no background remnant may resurrect (ADR-0019)
        run: |
          # The committed shooting sprites were hand-retouched to delete the dark
          # torn background halos around the baked muzzle flashes (ADR-0019,
          # "rectangle visible autour des personnages"). The WRITE pass of
          # retouch-flash-halos.mjs is deliberately NOT wired into CI — its
          # CLEAR_ZONES/thresholds are calibrated against the accepted bytes, and
          # auto-running it on freshly generated art could delete legitimate
          # flash pixels (same principle as retouch-sprites.mjs above). --check is
          # a TRUE gate: it writes nothing and exits 1 if any clear zone contains
          # remnant pixels again — either a regeneration re-shipped the halo or a
          # fill-sprite-holes morphology change re-opaqued cleared pixels. Both
          # need a human recalibration pass, not an auto-commit.
          node scripts/retouch-flash-halos.mjs --check

      - name: Re-measure muzzle anchors against the shipped pixels
        run: |
          # The per-frame `muzzle` anchors in levelArt.json are measurements of
          # the committed PNG bytes (flash-core centroid; see ADR-0016 and
          # docs/asset-pipeline.md). Any regeneration moves the baked flash, so
          # the anchors are re-measured in the same run and committed together
          # with the sprites — otherwise the in-game glow silently renders at a
          # stale position. Deterministic + idempotent: on a run that generated
          # nothing, this writes nothing. prettier is the script's formatting
          # normalizer (repo pin ^3.5.3); node_modules is otherwise absent here.
          npm install --no-save --legacy-peer-deps --ignore-scripts prettier@3.5.3
          node scripts/measure-muzzle-anchors.mjs

      # FOLLOW-UP: no automated STYLE gate for enemy sprites yet. The pixel gate
      # (scripts/check-sprite-style.mjs) is calibrated ONLY for the three vehicle
      # sprites (per-type hue bands + silhouette-aspect bounds from the PM-accepted
      # truck/car/moto PNGs). Enemy archetypes have different framing, hues and
      # proportions, so applying the vehicle thresholds here would be meaningless —
      # enemies are deliberately NOT blocked on the vehicle gate. A dedicated enemy
      # STYLE gate (own thresholds, calibrated against the accepted enemy_*.png set)
      # is a separate story before this workflow gets a pixel STYLE check.

      # NOTE: the post-cutout sprite-integrity gate step was removed (ADR-0029).
      # It was SCOPED to public/assets/enemy_civilian.png — the courier's legacy
      # single-frame sprite — as its one calibrated target; that sprite has been
      # retired (the courier now renders from the committed rider flipbook), so the
      # step would only fail on the missing file. scripts/check-sprite-integrity.mjs
      # is kept as generic infrastructure (a new target must be calibrated before it
      # is re-wired here); re-scoping the gate to the rider frames is a separate story.

      - name: Commit sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # paths are explicit and bounded; -f only bypasses the assets gitignore.
          # levelArt.json rides along because the muzzle anchors are re-measured
          # from the regenerated pixels in the step above.
          git add -f public/assets/enemy_*.png
          git add src/game/levels/levelArt.json
          if git diff --cached --quiet; then
            echo "No new sprites to commit."
          else
            git commit -m "chore(assets): generate enemy-type sprites (riot/biker/civilian/bonus)"
            # Bounded retry: another push may land while we generated. Push
            # first (normal case); on rejection rebase with --autostash (the
            # generation step can leave unstaged files that would abort a bare
            # rebase) and retry, max 3 attempts. The if: failure() upload below
            # preserves the assets so no paid generation is lost.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload generated sprites (push failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enemy-sprites-unpushed
          path: public/assets/enemy_*.png
          if-no-files-found: warn
          retention-days: 14
