name: Generate enemy-type sprites

# Generation of the extra enemy archetype sprites. Generates only MISSING
# files, chroma-keys them, and commits them to the current branch. Deliberate
# runs only: manual (workflow_dispatch) or by touching the dispatch marker
# .github/dispatch/gen-sprites (see docs/adr/0004). The sprites are already
# committed, so this is just a regeneration tool — running it on every push
# re-keyed existing sprites and created noise.
on:
  workflow_dispatch:
  push:
    # Only branch pushes (never main); a branches filter also drops tag pushes.
    branches-ignore: ["main"]
    paths:
      - ".github/dispatch/gen-sprites"

permissions:
  contents: write

concurrency:
  group: gen-sprites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # merge/rebase/revert pushes can match the paths filter; only explicit ci(dispatch): commits may fire it.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ci(dispatch):')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate missing enemy-type sprites
        run: node scripts/gen-enemy-types.mjs

      - name: Chroma-key sprite backgrounds to transparency
        run: |
          # Pinned exact version; --ignore-scripts skips postinstall since the
          # prebuilt native binary is fetched by the package resolution itself.
          # If --ignore-scripts ever breaks the prebuilt fetch, drop the flag but
          # keep the pin.
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2
          node scripts/cutout-enemies.mjs

      - name: Commit sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # paths are explicit and bounded; -f only bypasses the assets gitignore.
          git add -f public/assets/enemy_*.png
          if git diff --cached --quiet; then
            echo "No new sprites to commit."
          else
            git commit -m "chore(assets): generate enemy-type sprites (riot/biker/civilian/bonus)"
            # Bounded retry: another push may land while we generated. Push
            # first (normal case); on rejection rebase with --autostash (the
            # generation step can leave unstaged files that would abort a bare
            # rebase) and retry, max 3 attempts. The if: failure() upload below
            # preserves the assets so no paid generation is lost.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload generated sprites (push failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enemy-sprites-unpushed
          path: public/assets/enemy_*.png
          if-no-files-found: warn
          retention-days: 14
