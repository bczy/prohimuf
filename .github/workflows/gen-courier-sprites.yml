name: Generate courier sprites

# Regenerates the LAYERED courier flipbook (bike + rider) from the `courier`
# block of src/game/levels/levelArt.json with real FLUX art. PER-FRAME
# GENERATION (ADR 0016, amended): every frame is one dedicated FLUX image
# (whole subject in every image, shared per-layer seed, only the pose clause
# varies), chroma-keyed per file, and committed to the current branch. The
# original strip-and-slice strategy was retired after two CI iterations cut
# subjects across cells.
#
# Why this is a SEPARATE workflow from gen-sprites.yml (the enemy flipbook):
# the enemy set's frame semantics do not match the courier's.
#   - enemies: frame 1 is protected accepted art (never regenerated), extra
#     frames are generated MISSING-ONLY via kontext img2img off that committed
#     frame 1.
#   - courier: there is NO protected frame 1 — a layer is ATOMIC (shared-seed
#     consistency): if any frame is missing (or FORCE=1) ALL its frames
#     regenerate together. A shared workflow would have to special-case both
#     regimes; keeping them apart keeps each simple.
# @napi-rs/canvas is installed before the generator for the per-file chroma-key.
#
# Deliberate runs only: manual (workflow_dispatch) or by touching the dispatch
# marker .github/dispatch/gen-courier-sprites (see docs/adr/0009). FORCE=1 so it
# overwrites any committed placeholders (not just missing files).
on:
  workflow_dispatch:
  push:
    # Only branch pushes (never main); a branches filter also drops tag pushes.
    branches-ignore: ["main"]
    paths:
      - ".github/dispatch/gen-courier-sprites"

permissions:
  contents: write

concurrency:
  group: gen-courier-sprites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Never on main (branches-ignore only filters the push trigger — a manual
    # workflow_dispatch on main would otherwise FORCE-push art past the merge
    # gate). For pushes, only explicit ci(dispatch): commits may fire it
    # (merge/rebase/revert pushes can match the paths filter).
    if: github.ref_name != 'main' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ci(dispatch):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prompt gate (fail fast BEFORE any paid FLUX)
        run: node scripts/check-art-prompts.mjs --set courier

      - name: Install @napi-rs/canvas (per-file chroma-key)
        run: |
          # Pinned exact version; --ignore-scripts skips postinstall since the
          # prebuilt native binary is fetched by the package resolution itself.
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2

      - name: Generate courier sprites (one FLUX image per frame → chroma-key)
        # --layer rider: the bike layer passed the art gate and is committed —
        # do not churn it. The rider frames >= 2 are FLUX throwaways: the legs
        # retouch (like the bike spokes) will derive every frame from the
        # rider.png base once its geometry is tuned at the art gate.
        run: FORCE=1 node scripts/gen-courier-sprites.mjs --layer rider

      - name: Stamp rotating spokes on the bike frames (scripted retouch)
        # Derives every bike frame from the single FLUX base with the tri-spoke
        # Y drawn at 0/40/80 degrees — FLUX won't draw legible mag wheels, so
        # the rotation is deterministic pipeline work (see the script header).
        run: node scripts/retouch-bike-spokes.mjs

      - name: Commit sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f only bypasses the assets gitignore; the glob is bounded to the
          # courier dir. compgen guards the zero-file case (total generation
          # failure already exits the generator step non-zero, but an unmatched
          # glob must not die with a confusing pathspec fatal here).
          if compgen -G "public/assets/courier/*.png" > /dev/null; then
            git add -f public/assets/courier/*.png
          fi
          if git diff --cached --quiet; then
            echo "No new sprites to commit."
          else
            git commit -m "chore(assets): generate layered courier flipbook (bike/rider)"
            # Bounded retry: another push may land while we generated. Push first
            # (normal case); on rejection rebase with --autostash (the generation
            # step can leave unstaged files that would abort a bare rebase) and
            # retry, max 3 attempts. The if: failure() upload below preserves the
            # assets so no paid generation is lost.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload generated sprites (push failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: courier-sprites-unpushed
          path: public/assets/courier/*.png
          if-no-files-found: warn
          retention-days: 14
