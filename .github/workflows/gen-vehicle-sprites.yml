name: Generate vehicle sprites

# Regenerates the delivery-vehicle sprites (truck / car / moto) from the
# `vehicles` block of src/game/levels/levelArt.json with real FLUX art, keys
# their black background to transparency, and commits them to the current
# branch. Deliberate runs only: manual (workflow_dispatch) or by touching the
# dispatch marker .github/dispatch/gen-vehicle-sprites (see docs/adr/0009) —
# the committed PNGs may be procedural placeholders, so this is the tool that
# replaces them with generated art.
# FORCE=1 so it overwrites the placeholders (not just missing files). Generated
# art then passes the pixel style gate (scripts/check-sprite-style.mjs) — with a
# bounded regen retry — before it is committed, so no off-style sprite lands.
on:
  workflow_dispatch:
  push:
    # Only branch pushes (never main); a branches filter also drops tag pushes.
    branches-ignore: ["main"]
    paths:
      - ".github/dispatch/gen-vehicle-sprites"

permissions:
  contents: write

concurrency:
  group: gen-vehicle-sprites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # merge/rebase/revert pushes can match the paths filter; only explicit ci(dispatch): commits may fire it.
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'ci(dispatch):')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate vehicle sprites (FLUX) and chroma-key to transparency
        run: |
          # Pinned exact version; --ignore-scripts skips postinstall since the
          # prebuilt native binary is fetched by the package resolution itself.
          # If --ignore-scripts ever breaks the prebuilt fetch, drop the flag but
          # keep the pin. @napi-rs/canvas is needed both by the chroma-key detour
          # (cutout-enemies.mjs) and by the pixel style gate below.
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2
          FORCE=1 node scripts/gen-vehicle-sprites.mjs

      - name: Style gate (pixel check + bounded regen retry)
        run: |
          # ART GATE 2 — reject sprites that failed on a light ground (halo), lost
          # their assigned neon rim, or came back with the wrong silhouette. On a
          # FAIL we delete ONLY the offending PNG(s) and re-run the generator
          # WITHOUT FORCE — it fills missing files only, so exactly the deleted
          # sprites are regenerated (pinned seeds reproduce the reviewed art;
          # transient network flakes that left a file missing get another fetch).
          # Bounded to 2 extra attempts; still failing → the job fails and the
          # if: failure() upload below preserves the outputs for lead-art review.
          max_retries=2
          attempt=0
          fail_list="$RUNNER_TEMP/failing-vehicles.txt"
          while true; do
            if node scripts/check-sprite-style.mjs --fail-list "$fail_list"; then
              echo "Style gate passed."
              break
            fi
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "::error::vehicle style gate still failing after $max_retries retries"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Style gate failed — retry $attempt/$max_retries: regenerating only the failing sprites"
            while IFS= read -r t; do
              [ -n "$t" ] && rm -f "public/assets/vehicles/$t.png"
            done <"$fail_list"
            # No FORCE: regenerates only the just-deleted (now missing) sprites.
            node scripts/gen-vehicle-sprites.mjs
          done

      - name: Commit sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # paths are explicit and bounded; -f only bypasses the assets gitignore.
          git add -f public/assets/vehicles/truck.png public/assets/vehicles/car.png public/assets/vehicles/moto.png
          if git diff --cached --quiet; then
            echo "No new sprites to commit."
          else
            git commit -m "chore(assets): generate delivery-vehicle sprites (truck/car/moto)"
            # Bounded retry: another push may land while we generated. Push
            # first (normal case); on rejection rebase with --autostash (the
            # generation step can leave unstaged files that would abort a bare
            # rebase) and retry, max 3 attempts. The if: failure() upload below
            # preserves the assets so no paid generation is lost.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload generated sprites (push failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-sprites-unpushed
          path: public/assets/vehicles/*.png
          if-no-files-found: warn
          retention-days: 14
