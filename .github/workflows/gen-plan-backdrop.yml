name: Generate plan backdrop (paid)

# SP2 phase (a) — spec-level-harness-sp2 §3/§4.1, plan T3. Dispatches
# gen-street-paid.mjs --plan <level_id> for ONE generated level
# (src/game/levels/generated/<level_id>.ts) and commits the resulting
# public/assets/levels/<level_id>/<file>.png back to the branch.
#
# Budget guard (spec §2.1, cap corrected by the code-review panel on PR #153/
# #151 — see docs/game-design/plan-level-harness-sp2.md T3):
#   - the cap counts PAID ATTEMPTS, not successful commits — a paid call whose
#     asset commit-back later fails must still count, so a re-dispatch cannot
#     spend past the cap;
#   - a dedicated counter file, `public/assets/levels/<level_id>/.paid-attempts`,
#     is appended to and PUSHED before the paid call ever runs (a push failure
#     here aborts the job — no paid call without a trace);
#   - the guard step counts commits touching that file on `origin/main..HEAD`
#     with `--full-history` (default history simplification can prune a
#     path-touching commit away across a merge — under-counting paid attempts
#     is the one direction this guard must never err in) and fails at >= 3,
#     BEFORE the increment step runs (so exactly 3 attempts are allowed,
#     not 2);
#   - a commit-back failure AFTER a successful paid call is a hard FAIL, never
#     a warning — the spent attempt is never silently dropped from the count
#     (its trace commit is already pushed).
#
# One workflow run == one level == one paid attempt at most; the concurrency
# group serializes concurrent dispatches for the SAME level_id (a second
# in-flight run for the same level would otherwise read the guard's commit
# count before the first run's trace commit lands, letting two runs both pass
# the same "2 so far" check and spend a 4th attempt between them).
on:
  workflow_dispatch:
    inputs:
      level_id:
        description: "Generated level id (src/game/levels/generated/<id>.ts)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gen-plan-backdrop-${{ github.event.inputs.level_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Never on main — the same guard as gen-level-art.yml's; this workflow has
    # no push trigger to reason about, only the manual dispatch.
    if: github.ref_name != 'main'
    env:
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      LEVEL_ID: ${{ github.event.inputs.level_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync with origin (fetch main + pull the dispatched branch)
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Enable Corepack
        run: corepack enable

      # gen-street-paid.mjs --plan resolves the LevelPlan through
      # scripts/lib/loadPlan.mjs → jiti (a devDependency): without a real
      # install the import throws before any paid call — AFTER the attempt
      # trace is already pushed, silently burning one of the 3 capped tries.
      # Runs AFTER the branch sync so the install matches the pulled lockfile.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Guard — cap 3 PAID ATTEMPTS per level per PR
        run: |
          set -euo pipefail
          counter="public/assets/levels/${LEVEL_ID}/.paid-attempts"
          # A counter never committed on this branch counts as 0 attempts —
          # `git log` on a path with no history simply returns nothing.
          # --full-history: never let default history simplification prune a
          # path-touching commit across a merge — a paid attempt whose change
          # a merge resolution later discarded STILL counts against the cap.
          attempts=$(git log --full-history --oneline origin/main..HEAD -- "$counter" | wc -l | tr -d ' ')
          echo "paid attempts so far for '${LEVEL_ID}': ${attempts}"
          if [ "$attempts" -ge 3 ]; then
            echo "::error::level '${LEVEL_ID}' already has ${attempts} paid backdrop attempt(s) on this PR (hard cap: 3) — escalate to a human before dispatching this workflow again for this level."
            exit 1
          fi

      - name: Record a paid attempt (commit + PUSH, before the paid call)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          counter="public/assets/levels/${LEVEL_ID}/.paid-attempts"
          mkdir -p "$(dirname "$counter")"
          # Content is informative only (timestamp + run id) — the cap counts
          # COMMITS touching this path, never the file's own content.
          echo "$(date -u +%FT%TZ) run=${GITHUB_RUN_ID}" >> "$counter"
          git add -f "$counter"
          git commit -m "chore(assets): record a paid backdrop attempt for ${LEVEL_ID}"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::error::could not push the paid-attempt trace commit — refusing to spend a paid call with no trace of it."
            exit 1
          fi

      - name: Generate the backdrop (paid)
        run: node scripts/gen-street-paid.mjs --plan "$LEVEL_ID"

      - name: Commit the generated backdrop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "public/assets/levels/${LEVEL_ID}"
          if git diff --cached --quiet; then
            echo "::error::the paid call ran but produced no new committable file for '${LEVEL_ID}' — the attempt is already spent (its trace commit is pushed) but nothing else was committed."
            exit 1
          fi
          git commit -m "chore(assets): generate paid backdrop for ${LEVEL_ID}"
          # A push failure here is a hard FAIL, never a warning: the paid
          # attempt already counts (the trace commit landed above), so
          # swallowing this would silently lose committable art with no
          # record other than the bare counter bump.
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::error::commit-back of the generated backdrop failed after a successful paid call — the attempt still counts against the cap (its trace commit is already pushed); fix the push and re-run this same dispatch rather than spending another attempt."
            exit 1
          fi
