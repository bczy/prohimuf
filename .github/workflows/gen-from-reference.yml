name: Generate from reference (ad-hoc kontext)

# Ad-hoc kontext reference-conditioned asset iteration (ADR-0044). Runs ONE
# kontext img2img generation of `out` conditioned on `ref` (a committed
# reference image or an external URL), post-processes it per `family`, and
# commits the single output file back to the branch. Exploratory — NO style
# gate; the human reviews the result in the PR/branch preview. Two triggers:
# manual workflow_dispatch, or (for sessions whose token cannot dispatch
# workflows) a push touching .github/dispatch/gen-from-reference.json — the
# committed marker file carries the same inputs as JSON, guarded by the house
# `ci(dispatch):` head-commit convention. Either way the reference must
# already be committed and pushed on this branch so its
# raw.githubusercontent.com URL resolves at GITHUB_SHA.
on:
  push:
    branches-ignore: [main]
    paths: [".github/dispatch/gen-from-reference.json"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Reference image: repo-relative path (e.g. references/x.png) or full URL"
        required: true
      prompt:
        description: "Prompt sent verbatim to kontext (no enhancer)"
        required: true
      out:
        description: "Target PNG, repo-relative (e.g. public/assets/vehicles/moto.png)"
        required: true
      family:
        description: "Post-processing family"
        required: true
        type: choice
        options:
          - vehicles
          - enemies
          - levels
      seed:
        description: "Positive integer seed (reproducible roll)"
        required: true
      size:
        description: "WxH"
        required: false
        default: "256x256"
      style:
        description: "Optional style tail, appended verbatim to the prompt"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gen-from-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Never on main — this is an exploratory branch tool, not a production gate.
    # Push events additionally require the ci(dispatch): head-commit guard so an
    # unrelated edit of the marker file in a bigger push cannot fire a generation.
    if: github.ref_name != 'main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ci(dispatch):'))
    env:
      # Pollinations account tier (optional): when the POLLINATIONS_TOKEN repo
      # secret is set, scripts/lib/pollinations.mjs sends it as a Bearer header
      # for a faster rate limit + honoured `nologo`. Unset/empty → anonymous
      # fallback (unchanged behaviour), so the secret is not required.
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install @napi-rs/canvas (cutout / desaturate post-processing)
        run: |
          # Pinned exact version; --ignore-scripts skips postinstall since the
          # prebuilt native binary is fetched by the package resolution itself.
          npm install --no-save --legacy-peer-deps --ignore-scripts @napi-rs/canvas@1.0.2

      - name: Resolve params (push marker file → outputs)
        id: params
        if: github.event_name == 'push'
        run: |
          f=.github/dispatch/gen-from-reference.json
          for k in ref prompt out family seed size style; do
            v=$(jq -r --arg k "$k" '.[$k] // ""' "$f")
            {
              echo "$k<<PARAM_EOF"
              echo "$v"
              echo "PARAM_EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Generate from reference (kontext img2img) + post-process
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          REF: ${{ github.event.inputs.ref || steps.params.outputs.ref }}
          PROMPT: ${{ github.event.inputs.prompt || steps.params.outputs.prompt }}
          OUT: ${{ github.event.inputs.out || steps.params.outputs.out }}
          FAMILY: ${{ github.event.inputs.family || steps.params.outputs.family }}
          SEED: ${{ github.event.inputs.seed || steps.params.outputs.seed }}
          SIZE: ${{ github.event.inputs.size || steps.params.outputs.size || '256x256' }}
          STYLE: ${{ github.event.inputs.style || steps.params.outputs.style }}
        run: |
          node scripts/gen-from-reference.mjs \
            --ref "$REF" \
            --prompt "$PROMPT" \
            --out "$OUT" \
            --family "$FAMILY" \
            --seed "$SEED" \
            --size "$SIZE" \
            --style "$STYLE"

      - name: Commit output
        env:
          OUT: ${{ github.event.inputs.out || steps.params.outputs.out }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f only bypasses the assets gitignore; path is exactly the one file.
          git add -f "$OUT"
          if git diff --cached --quiet; then
            echo "No new asset to commit."
          else
            git commit -m "chore(assets): gen-from-reference $OUT (ADR-0044)"
            # Bounded retry: another push may land while we generated. Push
            # first (normal case); on rejection rebase with --autostash and
            # retry, max 3 attempts.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload generated asset (push failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gen-from-reference-unpushed
          path: ${{ github.event.inputs.out || steps.params.outputs.out }}
          if-no-files-found: warn
          retention-days: 14
