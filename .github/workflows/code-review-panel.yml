name: Code Review Panel

# Mandatory merge-gate implementation per ADR-0063 (CI-run code-review panel).
# Runs the 4 orthogonal review skills in parallel, an adversarial-verification
# pass (skeptic), and a triage job that publishes the `panel-verdict` check.
#
# Rollout — INERT by default (per ADR-0063 §6):
#   - `on:` is restricted to workflow_dispatch and workflow_call.
#   - Every job is guarded by `if: vars.PANEL_ENABLED == 'true'`.
#   - Activation is one commit: add `pull_request:` to `on:` AND set the
#     repo variable `PANEL_ENABLED=true` (Settings → Secrets and variables
#     → Actions → Variables tab). Both are required; either alone is a
#     no-op safeguard.
#
# Once activated, branch protection on `main` should require the
# `panel-verdict` check as a required status check.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (required when dispatched manually)"
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
  # Activation: uncomment the block below when PANEL_ENABLED=true.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: panel-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  # GitHub Models inference (the panel's LLM backend) — no third-party API key.
  models: read

jobs:
  prepare:
    name: Prepare diff and context
    if: ${{ vars.PANEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      is_fix_lane: ${{ steps.classify.outputs.is_fix_lane }}
      is_fork: ${{ steps.classify.outputs.is_fork }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR context
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr view "$PR_NUMBER" --json headRefOid,labels,baseRefName,headRepositoryOwner)
          head_sha=$(printf '%s' "$pr_json" | jq -r .headRefOid)
          base_ref=$(printf '%s' "$pr_json" | jq -r .baseRefName)
          head_owner=$(printf '%s' "$pr_json" | jq -r .headRepositoryOwner.login)
          is_fix=$(printf '%s' "$pr_json" | jq -r '[.labels[].name] | index("fix-lane") != null | tostring')
          # A fork PR must never trigger auto-remediation on someone else's branch.
          if [ "$head_owner" = "${GITHUB_REPOSITORY%%/*}" ]; then is_fork=false; else is_fork=true; fi
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'is_fix_lane=%s\n' "$is_fix" >> "$GITHUB_OUTPUT"
          printf 'is_fork=%s\n' "$is_fork" >> "$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - name: Assemble reviewer input
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p panel-input
          gh pr view "$PR_NUMBER" --json title,body > panel-input/pr.json
          # Diff the PR head explicitly rather than the checked-out HEAD: on a
          # workflow_dispatch run HEAD is the default branch, which would make
          # the diff empty and every reviewer blind. The PR head is fetched into
          # a named ref — with two refspecs in one fetch, FETCH_HEAD resolves to
          # the first one (main) and the diff silently comes out empty.
          git fetch --no-tags origin main
          git fetch --no-tags --force origin "pull/$PR_NUMBER/head:panel-head"
          git diff origin/main...panel-head --unified=3 > panel-input/diff.patch
          git diff --name-status origin/main...panel-head > panel-input/files.txt
          bytes=$(wc -c < panel-input/diff.patch)
          echo "diff bytes: $bytes"
          # An empty diff means the panel would rubber-stamp the PR. Fail loudly
          # instead: a silent PASS is exactly the failure mode this gate exists
          # to prevent.
          if [ "$bytes" -eq 0 ]; then
            echo "::error::Empty diff for PR #$PR_NUMBER — refusing to run a blind panel."
            exit 1
          fi

      - name: Upload panel input
        uses: actions/upload-artifact@v4
        with:
          name: panel-input
          path: panel-input/
          retention-days: 7

  code-review:
    name: "Reviewer · code-review (correctness)"
    needs: prepare
    if: ${{ vars.PANEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: panel-input, path: panel-input }
      - name: Invoke reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANEL_MODEL: ${{ vars.PANEL_MODEL || 'openai/gpt-4.1' }}
          PROMPT_FILE: .github/panel-prompts/code-review.md
          FINDINGS_FILE: findings-code-review.json
        run: node scripts/panel-invoke-reviewer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: findings-code-review
          path: findings-code-review.json

  edge-case-hunter:
    name: "Reviewer · edge-case-hunter"
    needs: prepare
    if: ${{ vars.PANEL_ENABLED == 'true' && needs.prepare.outputs.is_fix_lane == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: panel-input, path: panel-input }
      - name: Invoke reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANEL_MODEL: ${{ vars.PANEL_MODEL || 'openai/gpt-4.1' }}
          PROMPT_FILE: .github/panel-prompts/edge-case-hunter.md
          FINDINGS_FILE: findings-edge-case-hunter.json
        run: node scripts/panel-invoke-reviewer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: findings-edge-case-hunter
          path: findings-edge-case-hunter.json

  bmad-review:
    name: "Reviewer · bmad-review"
    needs: prepare
    if: ${{ vars.PANEL_ENABLED == 'true' && needs.prepare.outputs.is_fix_lane == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: panel-input, path: panel-input }
      - name: Invoke reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANEL_MODEL: ${{ vars.PANEL_MODEL || 'openai/gpt-4.1' }}
          PROMPT_FILE: .github/panel-prompts/bmad-review.md
          FINDINGS_FILE: findings-bmad-review.json
        run: node scripts/panel-invoke-reviewer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: findings-bmad-review
          path: findings-bmad-review.json

  security-review:
    name: "Reviewer · security-review"
    needs: prepare
    if: ${{ vars.PANEL_ENABLED == 'true' && needs.prepare.outputs.is_fix_lane == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: panel-input, path: panel-input }
      - name: Invoke reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANEL_MODEL: ${{ vars.PANEL_MODEL || 'openai/gpt-4.1' }}
          PROMPT_FILE: .github/panel-prompts/security-review.md
          FINDINGS_FILE: findings-security-review.json
        run: node scripts/panel-invoke-reviewer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: findings-security-review
          path: findings-security-review.json

  verify:
    name: "Skeptic · adversarial verification"
    needs: [prepare, code-review, edge-case-hunter, bmad-review, security-review]
    if: ${{ always() && vars.PANEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          pattern: findings-*
          path: findings-in
          merge-multiple: false
      - uses: actions/download-artifact@v4.1.3
        with: { name: panel-input, path: panel-input }
      - name: Invoke skeptic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANEL_MODEL: ${{ vars.PANEL_MODEL || 'openai/gpt-4.1' }}
          PROMPT_FILE: .github/panel-prompts/skeptic.md
        run: node scripts/panel-invoke-skeptic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: findings-confirmed
          path: findings-confirmed.json

  triage:
    name: "Triage · publish verdict"
    needs: [prepare, verify]
    if: ${{ always() && vars.PANEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: findings-confirmed, path: . }
      - name: Publish findings + verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: node scripts/panel-triage.mjs

  remediate:
    name: "Remediate · hand findings to Copilot"
    needs: [prepare, verify, triage]
    # Opt-in and same-repo only. Runs after triage so the verdict is published
    # first: remediation is an extra, never a precondition of the merge gate.
    if: >-
      ${{ always() && vars.PANEL_ENABLED == 'true' && vars.PANEL_AUTOFIX == 'true'
      && needs.prepare.outputs.is_fork == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with: { name: findings-confirmed, path: . }
      - name: Request Copilot remediation
        env:
          # PANEL_BOT_TOKEN (a PAT) is preferred: a comment posted with the
          # default GITHUB_TOKEN may not wake the Copilot coding agent.
          GH_TOKEN: ${{ secrets.PANEL_BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PANEL_AUTOFIX_MAX_ROUNDS: ${{ vars.PANEL_AUTOFIX_MAX_ROUNDS || '2' }}
        run: node scripts/panel-remediate.mjs
