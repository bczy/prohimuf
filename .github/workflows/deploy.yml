name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Pushes the built site to the `gh-pages` branch. The Pages site must be
# configured (Settings → Pages → Source: "Deploy from a branch" → gh-pages
# / root) for this to be served. main goes to the root; branch previews live
# under preview/<branch>/ on the same branch (see deploy-preview.yml).
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish to gh-pages root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # Gate the deploy on a build-output smoke test: serve dist under the real
      # base and confirm the home screen renders with no 404s. Blocks broken
      # builds / base-path misconfig from ever reaching the live site.
      - name: E2E home-screen smoke
        uses: ./.github/actions/e2e-home
        with:
          base: /prohimuf/

      - name: Upload home-screen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-home-main
          path: screenshots/e2e-home.png
          if-no-files-found: warn
          retention-days: 14

      # Gate the deploy on a REAL in-game render: serve dist, enter a level, and
      # confirm the R3F/WebGL game scene mounts. The home smoke above is pure DOM
      # and cannot catch a broken game scene — this step can, and blocks it from
      # ever reaching the live site.
      - name: E2E in-game smoke
        uses: ./.github/actions/e2e-ingame
        with:
          base: /prohimuf/

      - name: Upload in-game screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ingame-main
          path: screenshots/e2e-ingame.png
          if-no-files-found: warn
          retention-days: 14

      # (a) Full sweep: re-serve the build and enter EVERY level, not just one,
      # so a single broken level blocks the deploy. Reuses the e2e-ingame action
      # (it owns the serve/run/kill dance); all_levels=1 sets E2E_ALL_LEVELS,
      # which the QA lane makes scripts/e2e-ingame.mjs honor.
      - name: E2E all-levels sweep
        uses: ./.github/actions/e2e-ingame
        with:
          base: /prohimuf/
          all_levels: "1"

      # (b) Hard gate on the built assets themselves: fails on missing or
      # undersized asset files in dist (no server needed — it inspects disk).
      - name: E2E assets gate
        run: node scripts/e2e-assets.mjs

      # (c) Delivery-beat check, non-blocking for now. Promotion follow-up: soak
      # one deploy cycle, then drop continue-on-error to make it a hard gate.
      # The delivery script also runs the HALO GRADIENT gate (AC4,
      # scripts/check-halo-gradient.mjs) on its DELIVERING screenshot, which
      # decodes pixels via @napi-rs/canvas — a devDependency already present in
      # node_modules from the `yarn install` step above.
      - name: E2E delivery check (soak, non-blocking)
        continue-on-error: true
        uses: ./.github/actions/e2e-ingame
        with:
          base: /prohimuf/
          script: scripts/e2e-delivery.mjs

      # SPA fallback so deep links resolve on Pages.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Rebase-retry publish (see .github/actions/gh-pages-publish): overlays the
      # build onto the gh-pages root, preserving the preview/ subfolders that
      # branch deploys created, and re-clones + retries on a push race instead of
      # failing the production deploy.
      - name: Publish to gh-pages (root)
        uses: ./.github/actions/gh-pages-publish
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: main → / (${{ github.sha }})"
