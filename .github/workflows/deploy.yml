name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Pushes the built site to the `gh-pages` branch. The Pages site must be
# configured (Settings → Pages → Source: "Deploy from a branch" → gh-pages
# / root) for this to be served. main goes to the root; branch previews live
# under preview/<branch>/ on the same branch (see deploy-preview.yml).
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish to gh-pages root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # SPA fallback so deep links resolve on Pages.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Keep the preview/ subfolders that branch deploys created.
          keep_files: true
          commit_message: "deploy: main → / (${{ github.sha }})"
