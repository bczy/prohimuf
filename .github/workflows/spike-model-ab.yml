name: Spike model A/B

# THROWAWAY EVAL (not production art). Regenerates the courier `rider` flipbook
# across several Pollinations image models — two tracks: text-to-image seed-pinned
# (the current strategy) vs reference-conditioned img2img off the committed
# rider.png — and commits the RAW outputs under spike-out/ for the art gate
# (lead-art + game-graphist) to judge. Pollinations is only reachable from CI, so
# this is the only place the spike can actually spend. Manual-only: it must never
# fire on ordinary branch pushes.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Pollinations model IDs"
        required: false
        default: "flux,zimage,qwen-image,kontext,nanobanana-pro"
      frames:
        description: "Frames per model (max 6)"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: spike-model-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest
    # Never on main: this force-adds generated binaries to the branch.
    if: github.ref_name != 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate spike outputs (raw, per model, no keying)
        env:
          MODELS: ${{ github.event.inputs.models }}
          FRAMES: ${{ github.event.inputs.frames }}
        run: node scripts/spike-model-ab.mjs

      - name: Commit spike outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if compgen -G "spike-out/rider/*/*.png" > /dev/null; then
            git add spike-out
          else
            echo "::error::no spike outputs generated"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No spike outputs to commit."
          else
            git commit -m "chore(spike): image-model A/B outputs for courier rider"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt rejected — rebasing and retrying"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi
          fi

      - name: Upload spike outputs (belt-and-braces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-model-ab
          path: spike-out/**
          if-no-files-found: warn
          retention-days: 14
