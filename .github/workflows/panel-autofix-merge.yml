name: Panel Autofix Merge

# Closes the panel auto-remediation loop (ADR-0063).
#
# When the panel confirms BLOQUANT/MAJEUR findings it asks the Copilot coding
# agent to fix them. Copilot answers with a *stacked* pull request targeting the
# branch under review — it never commits to that branch directly. This workflow
# merges that corrective PR once CI is green, so the fix reaches the branch
# without human intervention, and then re-dispatches the panel.
#
# Guarded by the same opt-in as remediation: `PANEL_AUTOFIX=true`.
# Only merges pull requests authored by Copilot whose base is NOT the default
# branch — it can never merge anything into `main`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Merge Copilot corrective PR
    if: >-
      ${{ vars.PANEL_ENABLED == 'true' && vars.PANEL_AUTOFIX == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge if green, then re-run the panel
        env:
          GH_TOKEN: ${{ secrets.PANEL_BOT_TOKEN || github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/panel-autofix-merge.mjs
