name: Style B Preview

on:
  workflow_dispatch:
  push:
    branches: ["claude/graphics-change-conversation-279ooc"]
    paths-ignore:
      - "screenshots/**"

# Allow the job to commit the generated screenshots back to the branch.
permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render high-res screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # Installed via npm (not yarn) so yarn.lock stays untouched; node-modules
      # linker lets the script resolve "playwright" from node_modules.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          # Call vite directly — running it through the corepack `yarn` shim in
          # the background proved unreliable (the server detached and died).
          node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/preview.log 2>&1 &
          SERVER_PID=$!
          echo "preview server pid=$SERVER_PID"
          UP=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/prohimuf/ >/dev/null; then UP=1; break; fi
            sleep 1
          done
          if [ "$UP" != "1" ]; then
            echo "::error::Preview server failed to start"
            cat /tmp/preview.log || true
            exit 1
          fi
          echo "preview server is up"
          PREVIEW_URL="http://127.0.0.1:4173/prohimuf/" node scripts/screenshot-preview.mjs
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-b-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Commit screenshots to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(preview): update Style B screenshots [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
