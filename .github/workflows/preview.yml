name: Style B Preview

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate all level art from scratch (AI)"
        type: boolean
        default: false
  push:
    branches: ["claude/graphics-change-conversation-279ooc"]
    paths-ignore:
      - "screenshots/**"
      - "public/assets/levels/**"

# TEMPORARY: write for dev screenshot commit (removed before merge).
permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Generate art · render levels · contact sheet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # AI level art (pollinations). Only missing files are generated unless the
      # run was dispatched with regenerate=true. Must run before the build so
      # vite copies the images from public/ into dist/.
      - name: Generate level art
        run: |
          if [ "${{ github.event.inputs.regenerate }}" = "true" ]; then
            echo "Forcing full regeneration of level art"
            rm -rf public/assets/levels
            FORCE=1 node scripts/gen-level-art.mjs
          else
            node scripts/gen-level-art.mjs
          fi

      - name: Build
        run: yarn build

      # Installed via npm (not yarn) so yarn.lock stays untouched; the
      # node-modules linker lets the scripts resolve these from node_modules.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.48.0 @napi-rs/canvas
          npx playwright install --with-deps chromium

      # Chroma-key the magenta foreground to transparency. Done AFTER the build
      # (npm before `yarn build` corrupts the yarn install), so we update both
      # the source (committed) and the built copy that the preview serves.
      - name: Cut out foreground layer
        run: |
          node scripts/cutout-foreground.mjs
          for d in public/assets/levels/*/; do
            id=$(basename "$d")
            if [ -f "$d/foreground.png" ] && [ -d "dist/assets/levels/$id" ]; then
              cp "$d/foreground.png" "dist/assets/levels/$id/foreground.png"
            fi
          done

      - name: Render levels
        run: |
          # Call vite directly — running it through the corepack `yarn` shim in
          # the background proved unreliable (the server detached and died).
          node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/preview.log 2>&1 &
          SERVER_PID=$!
          echo "preview server pid=$SERVER_PID"
          UP=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/prohimuf/ >/dev/null; then UP=1; break; fi
            sleep 1
          done
          if [ "$UP" != "1" ]; then
            echo "::error::Preview server failed to start"
            cat /tmp/preview.log || true
            exit 1
          fi
          echo "preview server is up"
          PREVIEW_URL="http://127.0.0.1:4173/prohimuf/" node scripts/screenshot-preview.mjs
          kill "$SERVER_PID" 2>/dev/null || true

      # Screenshots are published as a downloadable artifact only — NOT
      # committed back to the branch. Auto-committing made a bot commit the PR
      # head, which (a) carried no CI status because GitHub does not run
      # workflows on GITHUB_TOKEN pushes, and (b) superseded the code commit's
      # own CI run. Artifact-only keeps the PR head on the real code commit.
      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-b-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Commit screenshots (dev preview)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f screenshots/
          if git diff --cached --quiet; then echo "Nothing to commit."; else
            git commit -m "chore(preview): dev screenshots"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
