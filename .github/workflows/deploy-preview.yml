name: Deploy branch preview

# Builds the playable app for any non-main branch and publishes it under
# preview/<branch>/ on the gh-pages branch, so you can try a branch live on
# GitHub Pages WITHOUT merging to main.
#
#   https://bczy.github.io/prohimuf/preview/<sanitized-branch>/
#
# Requires Settings → Pages → Source: "Deploy from a branch" → gh-pages / root.

# Auto-deploys on every push to claude/* branches (agent workflow: the preview
# is the on-device test surface). Any other branch stays deliberate: pick it in
# the Actions UI (Run workflow → choose ref).
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & publish branch preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize branch name
        id: slug
        run: |
          # Allowlist sanitize: map anything outside [a-zA-Z0-9._-] to '-' so a
          # crafted ref name cannot inject into the path/url derivations below.
          # (the '-' sits last in the set so GNU tr reads it literally, not as a
          # range endpoint).
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._\n-' '-')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "base=/prohimuf/preview/$slug/" >> "$GITHUB_OUTPUT"
          echo "url=https://bczy.github.io/prohimuf/preview/$slug/" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (sub-path base)
        env:
          VITE_BASE: ${{ steps.slug.outputs.base }}
        run: yarn build

      # Same regression guard as the main deploy, but under the preview sub-path
      # base — so a preview only publishes if its home screen actually loads.
      - name: E2E home-screen smoke
        uses: ./.github/actions/e2e-home
        with:
          base: ${{ steps.slug.outputs.base }}

      - name: Upload home-screen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-home-preview-${{ steps.slug.outputs.slug }}
          path: screenshots/e2e-home.png
          if-no-files-found: warn
          retention-days: 14

      # Same in-game render gate as the main deploy: enter a level and confirm
      # the R3F/WebGL scene mounts, under the preview sub-path base.
      - name: E2E in-game smoke
        uses: ./.github/actions/e2e-ingame
        with:
          base: ${{ steps.slug.outputs.base }}

      - name: Upload in-game screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ingame-preview-${{ steps.slug.outputs.slug }}
          path: screenshots/e2e-ingame.png
          if-no-files-found: warn
          retention-days: 14

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Previews must never be indexed by search engines — inject a robots
      # noindex into the <head> of both the app entry and the SPA fallback.
      - name: Add noindex meta to preview pages
        run: |
          for f in dist/index.html dist/404.html; do
            sed -i 's#<head>#<head><meta name="robots" content="noindex">#' "$f"
          done

      # Rebase-retry publish (see .github/actions/gh-pages-publish): re-clones
      # gh-pages each attempt and clean-replaces only preview/<slug> (so this
      # subdir never accumulates stale hashed assets), preserving the rest of
      # the branch (main's root + other previews). Concurrent branch deploys
      # never lose a plain-push race.
      - name: Publish to gh-pages (preview/${{ steps.slug.outputs.slug }})
        uses: ./.github/actions/gh-pages-publish
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/${{ steps.slug.outputs.slug }}
          commit_message: "preview: ${{ github.ref_name }} (${{ github.sha }})"

      - name: Summary
        # Pass the ref name and url through env, not ${{ }} interpolation into
        # the shell, so a crafted branch name cannot inject into the run block.
        env:
          PREVIEW_REF: ${{ github.ref_name }}
          PREVIEW_URL: ${{ steps.slug.outputs.url }}
        run: |
          echo "### 🔍 Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[$PREVIEW_REF → $PREVIEW_URL]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
