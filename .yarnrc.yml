enableStrictSsl: false

nodeLinker: node-modules

# Keep the package cache inside the project (.yarn/cache) rather than the shared
# global cache (~/.yarn/berry/cache). CI caches `path: .yarn/cache`, so with the
# default (global) cache the CI cache step stored almost nothing and every run
# re-downloaded. Project-local cache makes that cache step effective.
enableGlobalCache: false
