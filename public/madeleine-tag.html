<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Madeleine — tag live-paint</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #232327;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
      }
      svg#art {
        width: min(96vw, 1300px);
        height: auto;
        overflow: visible;
      }
      .can {
        filter: drop-shadow(0 0 8px currentColor);
      }
      button {
        background: none;
        border: 1px solid #39ff6a;
        color: #39ff6a;
        font: 13px/1 monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 16px;
        cursor: pointer;
      }
      button:hover {
        background: #39ff6a;
        color: #232327;
      }
      /* Throw-up/blockbuster stack (réf. textstudio graffiti-tag-102) :
         extrusion 3D -> contour sombre -> contour blanc -> fill dégradé + keyline */
      text {
        font-family: "Arial Black", "Impact", "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 218px;
        letter-spacing: 0.01em;
      }
      .extrude {
        fill: #2a0a3a;
      }
      .outline-dark {
        fill: none;
        stroke: #14081a;
        stroke-width: 30;
        stroke-linejoin: round;
      }
      .outline-white {
        fill: none;
        stroke: #ffffff;
        stroke-width: 14;
        stroke-linejoin: round;
      }
      .fill {
        fill: url(#lava);
        stroke: #7a2d00;
        stroke-width: 3;
        stroke-linejoin: round;
        paint-order: stroke;
      }
      .deco {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#spray);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="art" viewBox="0 0 1560 660" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe93c" />
            <stop offset="0.55" stop-color="#ff9a00" />
            <stop offset="1" stop-color="#ff5a1f" />
          </linearGradient>
          <!-- userSpaceOnUse: % regions collapse on straight strokes (zero-size bbox) -->
          <filter id="spray" filterUnits="userSpaceOnUse" x="-80" y="-80" width="1720" height="820">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.8"
              numOctaves="2"
              result="n"
              seed="7"
            />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
          </filter>
          <!-- rideau de révélation : un rect animé en width, façon wipe à la bombe -->
          <clipPath id="wipe"><rect id="wipeRect" x="0" y="0" width="0" height="660" /></clipPath>
          <!-- gloss clippé DANS les lettres -->
          <clipPath id="letters">
            <text x="70" y="420" transform="rotate(-3 780 330)">Madeleine</text>
          </clipPath>
        </defs>

        <g clip-path="url(#wipe)">
          <g id="word" transform="rotate(-3 780 330)">
            <!-- extrusion 3D : copies décalées vers le bas-droite -->
            <g class="extrude" aria-hidden="true">
              <text x="88" y="438">Madeleine</text>
              <text x="85" y="435">Madeleine</text>
              <text x="82" y="432">Madeleine</text>
              <text x="79" y="429">Madeleine</text>
              <text x="76" y="426">Madeleine</text>
              <text x="73" y="423">Madeleine</text>
            </g>
            <text class="outline-dark" x="70" y="420">Madeleine</text>
            <text class="outline-white" x="70" y="420">Madeleine</text>
            <text class="fill" x="70" y="420">Madeleine</text>
          </g>
          <!-- gloss diagonal, clippé dans les lettres -->
          <g clip-path="url(#letters)" opacity="0.5">
            <rect
              x="-200"
              y="150"
              width="2000"
              height="46"
              fill="#ffffff"
              transform="rotate(-8 780 330)"
            />
            <rect
              x="-200"
              y="215"
              width="2000"
              height="14"
              fill="#ffffff"
              transform="rotate(-8 780 330)"
            />
          </g>
        </g>

        <!-- déco peinte APRÈS le wipe : couronne, étincelles, coulures -->
        <g id="deco"></g>
        <circle class="can" r="9" opacity="0" id="canDot" fill="#fff" />
      </svg>
      <button id="replay">rejouer</button>
    </div>

    <script>
      // Déco en coordonnées globales (post-rotation approximée à l'œil).
      const CROWN = {
        d: "M96,128 L128,58 L168,112 L206,50 L244,112 L284,58 L316,128 Z",
        color: "#ffe93c",
        width: 10,
        speed: 1.2,
      };
      const SPARKS = [
        "M1382,120 L1402,160 M1362,150 L1422,130", // étoile 4 branches
        "M1470,220 L1482,252 M1456,242 L1496,230",
      ].map((d) => ({ d, color: "#ffffff", width: 7, speed: 1.2 }));
      const DRIPS = [
        "M300,505 L306,600",
        "M642,512 L648,632",
        "M905,505 L910,585",
        "M1258,492 L1264,600",
      ].map((d) => ({ d, color: "#ff5a1f", width: 9, speed: 2.6 }));
      const UNDERLINE = {
        d: "M1420,560 Q780,640 150,570",
        color: "#39ff6a",
        width: 10,
        speed: 0.9,
      };
      const DECO = [CROWN, ...SPARKS, UNDERLINE, ...DRIPS];

      const decoEl = document.getElementById("deco");
      const can = document.getElementById("canDot");
      const wipeRect = document.getElementById("wipeRect");
      const NS = "http://www.w3.org/2000/svg";
      const decoPaths = [];

      for (const s of DECO) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", s.d);
        p.setAttribute("class", "deco");
        p.setAttribute("stroke", s.color);
        p.setAttribute("stroke-width", s.width);
        decoPaths.push({ p, ...s });
        decoEl.appendChild(p);
      }

      function resetDeco() {
        for (const { p } of decoPaths) {
          const len = p.getTotalLength();
          p.setAttribute("stroke-dasharray", `${len} ${len}`);
          p.setAttribute("stroke-dashoffset", len);
        }
      }

      function animate(duration, step) {
        const start = performance.now();
        return new Promise((resolve) => {
          function tick(now) {
            const t = Math.min(1, (now - start) / duration);
            step(1 - Math.pow(1 - t, 2));
            if (t < 1) requestAnimationFrame(tick);
            else resolve();
          }
          requestAnimationFrame(tick);
        });
      }

      let running = false;
      async function play() {
        if (running) return;
        running = true;
        resetDeco();
        wipeRect.setAttribute("width", "0");
        can.setAttribute("opacity", "1");
        can.setAttribute("fill", "#ff9a00");

        // 1) wipe du bloc lettré, la bombe suit le bord du rideau
        await animate(2600, (e) => {
          const w = 1560 * e;
          wipeRect.setAttribute("width", w);
          can.setAttribute("cx", w - 20);
          can.setAttribute("cy", 330);
        });

        // 2) passes déco, la bombe suit chaque tracé
        for (const { p, color, speed } of decoPaths) {
          can.setAttribute("fill", color);
          const len = p.getTotalLength();
          await animate(Math.max(150, len * speed), (e) => {
            p.setAttribute("stroke-dashoffset", len * (1 - e));
            const tip = p.getPointAtLength(len * e);
            can.setAttribute("cx", tip.x);
            can.setAttribute("cy", tip.y);
          });
        }

        can.setAttribute("opacity", "0");
        running = false;
      }

      document.getElementById("replay").addEventListener("click", play);
      play();
    </script>
  </body>
</html>
